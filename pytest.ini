[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --import-mode=importlib + rootdir on sys.path so `from tests.conftest import ...`
# resolves without the package needing an __init__.py.
addopts = -v --tb=short --strict-markers --import-mode=importlib
pythonpath = .

# Turn the "returns a value instead of asserting" warning into an error.
# The two files this repo used to call a test suite (test_api.py, test_geofence.py)
# were print-driven scripts that returned True/False and wrapped everything in
# `try/except: return False`. Under pytest they passed unconditionally — a
# function that returns False without asserting is a pass. This makes that
# impossible to reintroduce.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning

markers =
    unit: unit tests
    integration: integration tests
    api: API endpoint tests
    service: service layer tests
    slow: slow running tests
